<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hack Halt School Safety – Android app demo</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9F0ED;--card:#fff;--ink:#0F2420;--mute:#5E726C;--line:#E0E9E5;--brand:#0B5D4B;--b2:#16866C;--soft:#E1F2EC;--amber:#8A5A00;--abg:#FDF1D6;--red:#B42F2F;--rbg:#FBE4E4;--green:#177A47;--gbg:#DFF3E7;--on:#fff;--sh:0 6px 20px rgba(15,36,32,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09120F;--card:#12211D;--ink:#E6F0EC;--mute:#93A9A2;--line:#22352F;--brand:#0E6B57;--b2:#1E9C7D;--soft:#173A31;--amber:#F0B848;--abg:#3A2E10;--red:#FF8A8A;--rbg:#3C1A1A;--green:#5BD08A;--gbg:#143323;--sh:none}}
:root[data-theme="dark"]{--bg:#09120F;--card:#12211D;--ink:#E6F0EC;--mute:#93A9A2;--line:#22352F;--brand:#0E6B57;--b2:#1E9C7D;--soft:#173A31;--amber:#F0B848;--abg:#3A2E10;--red:#FF8A8A;--rbg:#3C1A1A;--green:#5BD08A;--gbg:#143323;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;display:flex;gap:36px;justify-content:center;align-items:center;min-height:100vh;padding:20px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none;transition:transform .15s,background .2s}button:active{transform:scale(.97)}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;width:100%;outline:none}input:focus,textarea:focus{border-color:var(--b2)}
.side{max-width:300px}.side h1{font-size:22px;margin:0 0 6px;line-height:1.2}.side p{color:var(--mute);font-size:14px;line-height:1.5;margin:0 0 16px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}.seg button{flex:1;padding:9px 0;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute)}.seg .on{background:var(--brand);color:var(--on)}
.demo{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh)}.demo b{font-size:13px}.demo button{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--soft);font-weight:600;font-size:13px}
.phone{width:384px;height:780px;max-width:100%;background:var(--bg);border:9px solid #1a1e1d;border-radius:42px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.sb{display:flex;justify-content:space-between;padding:9px 22px 4px;font-size:12px;font-weight:600;color:var(--mute)}
#scr{flex:1;overflow-y:auto;scrollbar-width:none}#scr::-webkit-scrollbar{display:none}
.pg{padding:4px 16px 20px;animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(10px)}}
#nav{display:flex;background:var(--card);padding:8px 6px 12px;box-shadow:0 -4px 16px rgba(15,36,32,.06)}
#nav button{flex:1;font-size:11.5px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
#nav i{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .25s}#nav .on{color:var(--ink)}#nav .on i{background:var(--soft);color:var(--brand)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bar{display:flex;align-items:center;gap:10px;margin:4px 0 14px}.bar div{flex:1;min-width:0}.bar small{color:var(--mute);font-size:13px;display:block}.bar h2{margin:0;font-size:21px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;position:relative;flex:none}
.dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
h3{font-size:15px;margin:20px 0 10px}.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card p{margin:3px 0 0;color:var(--mute);font-size:14px;line-height:1.45}.k{font-size:12px;font-weight:700;margin-bottom:6px;opacity:.85}
.hero{background:linear-gradient(135deg,var(--brand),var(--b2));color:#fff}.hero p{color:#fff;opacity:.85}.hero .av{background:rgba(255,255,255,.2);color:#fff}
.alert{border:2px solid var(--amber);background:var(--abg)}.ok{border:2px solid var(--green);background:var(--gbg)}.bad{border:2px solid var(--red);background:var(--rbg)}.alert p,.ok p,.bad p{color:var(--ink)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--soft);color:var(--brand);flex:none}
.row{display:flex;gap:8px;margin-top:12px}.btn{flex:1;padding:13px 8px;border-radius:14px;font-weight:700;font-size:14px}
.y{background:var(--green);color:#fff}.n{background:var(--card);border:2px solid var(--red);color:var(--red)}.p{background:var(--brand);color:#fff}.g{background:var(--soft);color:var(--brand)}
.otp{font-size:40px;font-weight:800;letter-spacing:.2em;text-align:center;margin:8px 0 2px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}.li:last-child{border:0}.li div{flex:1;min-width:0}.li b{font-size:15px;display:block}.li span{font-size:13px;color:var(--mute)}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;flex:none}.c-g{background:var(--gbg);color:var(--green)}.c-a{background:var(--abg);color:var(--amber)}.c-r{background:var(--rbg);color:var(--red)}.c-m{background:var(--soft);color:var(--brand)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{padding:8px 14px;border-radius:20px;background:var(--card);font-size:13px;font-weight:600;color:var(--mute);box-shadow:var(--sh)}.tabs .on{background:var(--brand);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stats .card{margin:0;padding:14px}.stats b{font-size:26px;display:block}.stats span{font-size:12px;color:var(--mute)}
.pb{height:8px;border-radius:6px;background:var(--soft);margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--b2));transition:width .6s}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}.ck.d{background:var(--green);border-color:var(--green)}
.msg{max-width:80%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.4;margin-bottom:8px;animation:in .25s}.me{background:var(--brand);color:#fff;margin-left:auto;border-bottom-right-radius:5px}.th{background:var(--card);border-bottom-left-radius:5px;box-shadow:var(--sh)}
#hb{position:absolute;left:10px;right:10px;top:-120px;background:#1a1e1d;color:#fff;border-radius:18px;padding:12px 14px;z-index:5;transition:top .4s cubic-bezier(.2,.9,.3,1);box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:left}#hb.s{top:34px}#hb b{font-size:13px;display:block}#hb span{font-size:12.5px;opacity:.8}
#toast{position:absolute;left:18px;right:18px;bottom:84px;background:#1a1e1d;color:#fff;padding:12px 14px;border-radius:14px;font-size:13px;font-weight:600;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:6}#toast.s{opacity:1;transform:none}
@media (max-width:480px){body{padding:0;gap:0;align-items:stretch}.side{padding:16px;max-width:none}.phone{border:0;border-radius:0;width:100%;height:92vh;box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="side"><h1>Hack Halt School Safety</h1>
<p>Fully clickable Android app demo for Daksha Verma (Class 11 Science, class teacher Ms. Reema). Trigger the gate scan, then switch roles to follow the alert, notifications and replies.</p>
<div class="seg" id="seg"></div>
<div class="demo"><b>Demo controls</b><button onclick="gate()">1. Gate scans Daksha leaving</button><button onclick="silent()">2. Parent does not reply</button><button onclick="reset()">Reset demo</button></div></div>
<div class="phone"><div class="sb"><span>1:15 PM</span><span>5G ▮▮▮ 82%</span></div><div id="hb" onclick="openN()"></div><div id="scr"></div><div id="nav"></div><div id="toast"></div></div>
<script>
const $=s=>document.querySelector(s),I={home:"M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",doc:"M6 3h9l4 4v14H6zM14 3v5h5",cal:"M4 6h16v14H4zM4 10h16M8 3v4M16 3v4",chat:"M4 5h16v11H9l-5 4z",check:"M5 12l5 5 9-10",list:"M5 6h14M5 12h14M5 18h14",mega:"M4 10v4h3l7 4V6L7 10zM17 9a4 4 0 0 1 0 6",bell:"M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4",back:"M15 5l-7 7 7 7",grid:"M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",edit:"M4 20h4L19 9l-4-4L4 16z"};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${I[n]}"/></svg>`,av=n=>`<div class="av">${n.split(" ").map(w=>w[0]).join("").slice(0,2)}</div>`;
const KIDS=["Daksha Verma","Ishaan Nair","Tara Menon","Vihaan Gupta","Anaya Reddy","Zoya Khan"];
const S={role:"parent",tab:0,sub:null,rt:0,x:"idle",att:["present","present","present","present","late","absent"],pub:false,
hw:[{t:"Physics: Numericals on motion",d:0},{t:"Chemistry: Mole concept worksheet",d:0},{t:"Biology: Draw cell diagram",d:1}],
tests:[{id:1,n:"Physics UT2",m:36,o:40,a:31,r:"Strong on kinematics. Revise vectors."},{id:2,n:"Chemistry quiz",m:27,o:30,a:23,r:"Excellent accuracy."},{id:3,n:"Biology UT2",m:38,o:40,a:32,r:"Top of the class."},{id:4,n:"Maths UT2",m:31,o:40,a:28,r:"Practice integration."}],
ev:[{id:1,t:"Parent-teacher meeting",d:"Fri 9 Oct, 10:00 AM",l:"Room 11-Science or Meet link",x:"Discuss Daksha's term progress with Ms. Reema.",reg:0},{id:2,t:"Science exhibition",d:"Mon 12 Oct",l:"School auditorium",x:"Daksha's project Solar Water Purifier is selected for the inter-school round.",reg:1},{id:3,t:"Physics Olympiad",d:"Registration closes 15 Oct",l:"Online",x:"Open to Class 11 and 12. Register before the deadline.",reg:0},{id:4,t:"Annual day",d:"Sat 24 Oct, 4:00 PM",l:"Main ground",x:"Parents are invited. Seating from 3:30 PM.",reg:0}],
chat:[{m:0,t:"Good afternoon! Daksha did very well in today's physics lab."}],
N:{parent:[{t:"Daksha checked in",b:"Arrived at school at 8:02 AM",r:1,g:0}],teacher:[],admin:[]},
log:[{n:"Tara Menon",c:"11-A",t:"10:42 AM",s:"approved",by:"Parent"},{n:"Vihaan Gupta",c:"11-Science",t:"11:30 AM",s:"approved",by:"Parent"}]};
const X={waiting:["Waiting for parent","a"],approved:["Approved","g"],denied:["Parent said No","r"],escalated:["No reply","r"]},chip=s=>`<span class="chip c-${X[s][1]}">${X[s][0]}</span>`;
function toast(m){const t=$("#toast");t.textContent=m;t.className="s";clearTimeout(t.h);t.h=setTimeout(()=>t.className="",2400)}
function push(role,t,b,g){S.N[role].unshift({t,b,g:g||0,r:0});if(S.role==role){const h=$("#hb");h.innerHTML=`<b>${t}</b><span>${b}</span>`;h.className="s";clearTimeout(h.h);h.h=setTimeout(()=>h.className="",3800)}}
const un=r=>S.N[r].filter(n=>!n.r).length;
function openN(){$("#hb").className="";S.sub={k:"n"};render()}
function set(s){S.x=s;if(S.log[0].n=="Daksha Verma")S.log[0].s=s}
function gate(){if(S.x!="idle")return toast("Already running. Reset to start again.");S.log.unshift({n:"Daksha Verma",c:"11-Science",t:"1:15 PM",s:"waiting",by:"Pending"});S.x="waiting";push("parent","Is Daksha leaving school?","Gate 2 recorded an exit. Tap to reply Yes or No.",0);push("teacher","Exit alert: Daksha Verma","Parent approval pending. Hold her at the gate.",0);push("admin","Early exit pending","Daksha Verma (11-Science), Gate 2.",0);S.sub=null;render()}
function reply(y){S.log[0].by="Parent (Mrs. Verma)";set(y?"approved":"denied");push("teacher",y?"Exit approved":"Parent said No",y?"Daksha may leave with the pickup code.":"Keep Daksha in class and inform the gate.",0);push("admin","Exit "+(y?"approved":"denied"),"Daksha Verma, 1:16 PM.",1);render();toast(y?"Approved. Gate and teacher notified.":"Exit held. School alerted.")}
function silent(){if(S.x!="waiting")return toast("Run step 1 first.");S.log[0].by="Second contact called";set("escalated");push("parent","You missed a request","The school is holding Daksha and calling your second contact.",0);push("teacher","No reply from parent","Daksha is being held. Admin is calling the second contact.",0);push("admin","Escalation: no reply","Daksha Verma. Second guardian is being called.",0);render()}
function reset(){if(S.log[0].n=="Daksha Verma")S.log.shift();S.x="idle";S.sub=null;S.pub=false;S.tests=S.tests.filter(t=>t.id<5);render()}
const role=r=>{S.role=r;S.tab=0;S.sub=null;render()},tab=i=>{S.tab=i;S.sub=null;render()},sub=(k,id)=>{S.sub={k,id};render()},back=()=>{S.sub=null;render()};
const bar=(a,b)=>`<div class="bar"><div><small>${a}</small><h2>${b}</h2></div><button class="ib" onclick="openN()">${ic("bell")}${un(S.role)?`<span class="dot">${un(S.role)}</span>`:""}</button></div>`;
const head=t=>`<div class="bar"><button class="ib" onclick="back()">${ic("back")}</button><div><h2>${t}</h2></div></div>`;
const pb=(l,v,m)=>`<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${l}</span><b>${v}${m?"/"+m:"%"}</b></div><div class="pb"><i style="width:${m?v/m*100:v}%"></i></div></div>`;
const exit=()=>({idle:`<div class="card hero"><div class="k">In school</div><h2 style="margin:0">Daksha is at school</h2><p>Checked in at 8:02 AM · Class 11 Science</p></div>`,
waiting:`<div class="card alert"><div class="k">Action needed</div><h2 style="margin:0">Is Daksha leaving school?</h2><p>Gate 2 recorded an exit at 1:15 PM. Reply so the teacher and gate know.</p><div class="row"><button class="btn y" onclick="reply(1)">Yes, she is leaving</button><button class="btn n" onclick="reply(0)">No, hold her</button></div><p style="font-size:12px;margin-top:10px">No reply in 2 minutes? The school calls your second contact.</p></div>`,
approved:`<div class="card ok"><div class="k">Approved</div><h2 style="margin:0">Show this code at the gate</h2><div class="otp">4 8 2 1</div><p style="text-align:center">Pickup by Rakesh Verma (father). Logged 1:16 PM.</p></div>`,
denied:`<div class="card bad"><div class="k">Exit held</div><h2 style="margin:0">Daksha is staying in school</h2><p>The gate and Ms. Reema were alerted. Staff are with her.</p><div class="row"><button class="btn p" onclick="toast('Calling school office…')">Call school</button></div></div>`,
escalated:`<div class="card bad"><div class="k">Missed request</div><h2 style="margin:0">You have not replied</h2><p>The school is holding Daksha and calling your second contact.</p><div class="row"><button class="btn y" onclick="reply(1)">Yes, she is leaving</button><button class="btn n" onclick="reply(0)">No, hold her</button></div></div>`}[S.x]);
const logRow=l=>`<div class="li">${av(l.n)}<div><b>${l.n} · ${l.c}</b><span>${l.t} · ${l.by}</span></div>${chip(l.s)}</div>`;
const V={parent:[
()=>`${bar("Good afternoon, Mrs. Verma","Daksha's day")}<div class="card"><div class="li" style="padding-top:0">${av("Daksha Verma")}<div><b>Daksha Verma</b><span>Class 11 · Science · Roll 14</span></div></div><div class="li" style="padding-bottom:0">${av("Reema Kapoor")}<div><b>Ms. Reema Kapoor</b><span>Class teacher</span></div><button class="chip c-m" onclick="tab(3)">Message</button></div></div>${exit()}
<div class="stats"><button class="card" onclick="S.rt=2;tab(1)"><b>94%</b><span>Attendance</span></button><button class="card" onclick="S.rt=1;tab(1)"><b>88%</b><span>Test average</span></button></div>
<h3>Homework</h3><div class="card">${S.hw.map((h,i)=>`<button class="li" onclick="S.hw[${i}].d^=1;render()"><span class="ck ${h.d?"d":""}">${h.d?ic("check"):""}</span><div><b style="${h.d?"text-decoration:line-through;color:var(--mute)":""}">${h.t}</b></div></button>`).join("")}</div>
<h3>Next event</h3><button class="card li" style="margin:0" onclick="sub('e',1)">${av("PT")}<div><b>${S.ev[0].t}</b><span>${S.ev[0].d}</span></div></button>`,
()=>`${bar("Reports","Daksha's progress")}<div class="tabs">${["Daily","Tests","Attendance"].map((t,i)=>`<button class="${i==S.rt?"on":""}" onclick="S.rt=${i};render()">${t}</button>`).join("")}</div>`+[
`<div class="card"><b>Today · Class 11 Science</b>${[["Physics","Projectile motion"],["Chemistry","Mole concept"],["Biology","Cell structure lab"],["Maths","Integration basics"]].map(r=>`<div class="li">${av(r[0])}<div><b>${r[0]}</b><span>${r[1]}</span></div></div>`).join("")}<p>Teacher note: Daksha took part actively and led the lab team.</p></div>`,
`<div class="card">${S.tests.map(t=>`<button class="li" onclick="sub('t',${t.id})">${av(t.n)}<div><b>${t.n}</b><span>${t.m} out of ${t.o}</span></div><span class="chip c-g">${Math.round(t.m/t.o*100)}%</span></button>`).join("")}</div>`,
`<div class="card"><b>October attendance</b>${pb("Present",94)}<p>17 of 18 days present. 1 late arrival.</p><div style="display:flex;gap:5px;margin-top:12px;flex-wrap:wrap">${[...Array(18)].map((_,i)=>`<i style="width:18px;height:18px;border-radius:6px;background:${i==6?"var(--amber)":"var(--green)"}"></i>`).join("")}</div></div>`][S.rt],
()=>`${bar("Events","School calendar")}<div class="card">${S.ev.map(e=>`<button class="li" onclick="sub('e',${e.id})">${av(e.t)}<div><b>${e.t}</b><span>${e.d}</span></div>${e.reg?'<span class="chip c-g">Registered</span>':""}</button>`).join("")}</div>`,
()=>`${head("Ms. Reema Kapoor")}<div id="ch">${S.chat.map(c=>`<div class="msg ${c.m?"me":"th"}">${c.t}</div>`).join("")}</div><div class="row" style="position:sticky;bottom:0"><input id="ci" placeholder="Write a message" onkeydown="if(event.key=='Enter')send()"><button class="btn p" style="flex:none;padding:0 18px" onclick="send()">Send</button></div>`],
teacher:[()=>{const c=S.att.filter(a=>a=="present").length,w=S.x=="idle"?"":S.x=="denied"?`<div class="card bad"><b>Daksha's parent said No</b><p>Keep her in class and inform the gate.</p></div>`:S.x=="approved"?`<div class="card ok"><b>Daksha's exit is approved</b><p>She may leave with the pickup code.</p></div>`:`<div class="card alert"><b>Hold Daksha at the gate</b><p>Parent has not approved the exit yet.</p></div>`;
return `${bar("Ms. Reema Kapoor","Class 11 Science")}${w}<div class="card"><b>Attendance · ${c} of 6 present</b>${KIDS.map((n,i)=>`<button class="li" onclick="cyc(${i})">${av(n)}<div><b>${n}</b><span>Tap to change</span></div>${i==0&&S.x!="idle"?chip(S.x):""}<span class="chip c-${{present:"g",late:"a",absent:"r"}[S.att[i]]}">${S.att[i]}</span></button>`).join("")}</div><div class="row"><button class="btn p" onclick="subm()">Submit attendance</button></div>`},
()=>`${bar("Marks","Physics UT3 · out of 40")}<div class="card">${KIDS.map((n,i)=>`<div class="li">${av(n)}<div><b>${n}</b></div><input style="width:70px;text-align:center" value="${[34,29,31,26,33,28][i]}"></div>`).join("")}</div><div class="row"><button class="btn p" onclick="publish()">${S.pub?"Published":"Publish results"}</button></div>`],
admin:[()=>{const a=S.log.filter(l=>l.s=="denied"||l.s=="escalated").length,w=S.log.filter(l=>["waiting","denied","escalated"].includes(l.s));return `${bar("Principal","Safety dashboard")}<div class="stats"><div class="card"><b>1,201</b><span>of 1,247 present</span></div><div class="card"><b>${S.log.filter(l=>l.s=="approved").length}</b><span>exits approved</span></div><div class="card"><b>${S.log.filter(l=>l.s=="waiting").length}</b><span>waiting</span></div><div class="card"><b style="color:${a?"var(--red)":"inherit"}">${a}</b><span>alerts</span></div></div><h3>Needs attention</h3><div class="card">${w.map(logRow).join("")||"<p>Nothing to review. Run the gate scan to see an alert.</p>"}</div>`},
()=>`${bar("Exit log","Today")}<div class="card">${S.log.map(logRow).join("")}</div><p style="color:var(--mute);font-size:13px">Every exit is stored with time, approver and gate.</p>`,
()=>`${bar("Broadcast","Notices and events")}<div class="card"><b>Message to all parents</b><textarea id="bm" rows="3">School closes at 2 PM today due to heavy rain. Buses leave at 2:15 PM.</textarea><div class="row"><button class="btn p" onclick="bc(0)">Send notice</button><button class="btn n" onclick="bc(1)">Emergency</button></div></div><div class="card"><b>Add an event</b><input id="et" placeholder="Event name" style="margin:10px 0 8px"><input id="ed" placeholder="Date, e.g. Fri 30 Oct"><div class="row"><button class="btn g" onclick="addE()">Publish event</button></div></div>`]};
const NAV={parent:[["Home","home"],["Reports","doc"],["Events","cal"],["Chat","chat"]],teacher:[["Attendance","check"],["Marks","edit"]],admin:[["Dashboard","grid"],["Exit log","list"],["Broadcast","mega"]]};
function cyc(i){S.att[i]={present:"late",late:"absent",absent:"present"}[S.att[i]];render()}
function subm(){if(S.att[0]!="present")push("parent","Attendance update","Daksha was marked "+S.att[0]+" today.",0);toast("Attendance saved. Parents notified.");S.sub=null}
function publish(){if(S.pub)return;S.pub=1;S.tests.unshift({id:5,n:"Physics UT3",m:34,o:40,a:29,r:"Great improvement since UT2."});push("parent","New result: Physics UT3","Daksha scored 34 out of 40. Tap to view.",1);toast("Results published to parents.");render()}
function bc(e){const m=$("#bm").value;["parent","teacher"].forEach(r=>push(r,e?"EMERGENCY ALERT":"School notice",m,0));toast(e?"Emergency alert sent with SMS backup.":"Notice sent to all families.")}
function addE(){const t=$("#et").value.trim(),d=$("#ed").value.trim();if(!t)return toast("Enter an event name.");S.ev.push({id:Date.now(),t,d:d||"Date to be announced",l:"School",x:"New event added by the principal.",reg:0});push("parent","New event: "+t,d||"Date to be announced",2);toast("Event published.");$("#et").value=""}
function send(){const i=$("#ci"),v=i.value.trim();if(!v)return;S.chat.push({m:1,t:v});render();setTimeout(()=>{S.chat.push({m:0,t:"Thank you, Mrs. Verma. I will update you shortly."});push("parent","Ms. Reema replied","Thank you, Mrs. Verma. I will update you shortly.",3);render()},1300)}
function detail(){const k=S.sub.k;if(k=="t"){const t=S.tests.find(x=>x.id==S.sub.id);return `${head(t.n)}<div class="card hero"><div class="k">Score</div><h2 style="font-size:38px;margin:0">${t.m}/${t.o}</h2><p>${Math.round(t.m/t.o*100)}% · Class average ${t.a}/${t.o}</p></div><div class="card">${pb("Daksha",t.m,t.o)}${pb("Class average",t.a,t.o)}<p style="margin-top:14px">Teacher remark: ${t.r}</p></div>`}
if(k=="e"){const e=S.ev.find(x=>x.id==S.sub.id);return `${head(e.t)}<div class="card"><b>${e.d}</b><p>${e.l}</p><p style="margin-top:12px">${e.x}</p><div class="row"><button class="btn ${e.reg?"n":"p"}" onclick="reg(${e.id})">${e.reg?"Cancel registration":"Register Daksha"}</button></div></div>`}
return `${head("Notifications")}<div class="row" style="margin:0 0 12px"><button class="btn g" onclick="S.N[S.role].forEach(n=>n.r=1);render()">Mark all read</button></div><div class="card">${S.N[S.role].map((n,i)=>`<button class="li" onclick="S.N[S.role][${i}].r=1;go(${n.g})"><div><b style="${n.r?"color:var(--mute);font-weight:500":""}">${n.t}</b><span>${n.b}</span></div>${n.r?"":'<span class="chip c-r">New</span>'}</button>`).join("")||"<p>No notifications yet.</p>"}</div>`}
function reg(id){const e=S.ev.find(x=>x.id==id);e.reg^=1;push("parent",e.reg?"Registered":"Registration cancelled",e.t,0);toast(e.reg?"Daksha is registered.":"Registration cancelled.");render()}
function go(g){S.sub=null;if(S.role=="parent")S.tab=[0,1,2,3][g];if(S.role=="parent"&&g==1)S.rt=1;render()}
function render(){$("#scr").innerHTML=`<div class="pg">${S.sub?detail():V[S.role][S.tab]()}</div>`;$("#nav").innerHTML=NAV[S.role].map((n,i)=>`<button class="${i==S.tab&&!S.sub?"on":""}" onclick="tab(${i})"><i>${ic(n[1])}</i>${n[0]}</button>`).join("");$("#seg").innerHTML=["parent","teacher","admin"].map(r=>`<button class="${r==S.role?"on":""}" onclick="role('${r}')">${r[0].toUpperCase()+r.slice(1)}</button>`).join("")}
render();
</script></body></html>
